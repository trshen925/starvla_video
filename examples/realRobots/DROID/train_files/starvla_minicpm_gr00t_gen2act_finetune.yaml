run_id: minicpm_gr00t_gen2act_droid_h15_vlmft
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: trshen925-peking-university
wandb_project: gen2act
is_debug: false
version_id: "0.21"

framework:
  name: MiniCPMGR00T
  qwenvl:
    base_vlm: playground/Pretrained_models/MiniCPM-V-4.6
    attn_implementation: sdpa
    enable_gradient_checkpointing: true
  action_model:
    action_model_type: DiT-B
    action_dim: 8
    state_dim: 8
    action_horizon: 15
    repeated_diffusion_steps: 2
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 1024
      num_layers: 12
      output_dim: 1024
      dropout: 0.1
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm

datasets:
  vla_data:
    dataset_py: raw_droid_ex_gen2act
    root: /mnt/pfs/data/shentingrui/droid-ex-3000-out
    mapping_path: /mnt/pfs/users/shentingrui/code/robo/video_gen/gen2act/gen2act/metadata/c42_c39_to_raw_droid_mapping.json
    obs_image_size: [224, 224]
    num_source_frames: 8
    fps: 15
    source_time_crop: true
    source_crop_min_seconds: 10.0
    source_crop_max_seconds: 30.0
    action_horizon: 15
    max_samples: null
    per_device_batch_size: 2
    num_workers: 4
    persistent_workers: true
    prefetch_factor: 4

trainer:
  # Resume from the latest checkpoint in this run.
  # The trainer restores the model weights and continues the global step count.
  is_resume: true
  max_train_steps: 150000
  num_warmup_steps: 2500
  save_interval: 5000
  eval_interval: 1000
  learning_rate:
    base: 1.0e-05
    # Rescaled for the 150k cosine schedule to avoid an LR jump on resume.
    qwen_vl_interface: 6.0e-07
    action_model: 1.2e-04
  lr_scheduler_type: cosine
  scheduler_specific_kwargs: {}
  # Fine-tune MiniCPM-V at a low LR and the DiT head at 1.2e-4.
  freeze_modules: ''
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  gradient_clipping: 1.0
  logging_frequency: 10
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-06
  save_format: pt
